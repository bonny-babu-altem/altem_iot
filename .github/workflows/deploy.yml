name: Deploy on Stable Merge

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker containers and images
        run: docker system prune -f

      - name: Shut down any running Compose stack
        run: docker-compose -f docker-compose.yml down || true

      - name: Debug env
        env:
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          echo "F170_TB_MQTT_ACCESS_TOKEN='$F170_TB_MQTT_ACCESS_TOKEN'"

      - name: Build and deploy with docker-compose
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: docker compose -f docker-compose.yml up -d --build

      - name: Show logs if deploy fails
        if: failure()
        run: docker-compose -f docker-compose.yml logs --tail=100
