name: Deploy on Stable Merge

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker containers and images
        run: docker system prune -f

      - name: Build Docker images with docker compose
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          # Make sure docker-compose.yml uses 'image:', not 'build:'
          docker compose -f docker-compose.yml build

      - name: Deploy or update stack in Portainer via API
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_URL: "https://altempi.local:9443/api"
          ENDPOINT_ID: "3"
          STACK_NAME: "altem_iot"
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          set -e

          # Encode docker-compose.yml as JSON string for API
          COMPOSE_CONTENT=$(jq -Rs '.' < docker-compose.yml)

          # Prepare environment variables array as "KEY=VALUE" strings
          ENV_VARS=$(jq -n \
            --arg display "$DISPLAY" \
            --arg mqtt "$F170_TB_MQTT_ACCESS_TOKEN" \
            '[ "DISPLAY=\($display)", "F170_TB_MQTT_ACCESS_TOKEN=\($mqtt)" ]')

          # Compose the JSON payload with correct casing per Swagger
          JSON_PAYLOAD=$(jq -n \
            --arg name "$STACK_NAME" \
            --arg stackfile "$COMPOSE_CONTENT" \
            --argjson env "$ENV_VARS" \
            '{Name: $name, StackFileContent: $stackfile, Env: $env}')

          # Check if stack exists and get its ID
          STACK_ID=$(curl -s -k -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/stacks" | jq -r ".[] | select(.Name==\"$STACK_NAME\") | .Id")

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "Stack exists with ID: $STACK_ID. Updating stack..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X PUT "$PORTAINER_URL/stacks/$STACK_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Status code: $HTTP_STATUS"
            echo "Response body: $HTTP_BODY"
          else
            echo "Stack does not exist. Creating a new stack..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X POST "$PORTAINER_URL/stacks/create/standalone/string?endpointId=$ENDPOINT_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$JSON_PAYLOAD")

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Status code: $HTTP_STATUS"
            echo "Response body: $HTTP_BODY"

            # Save compose content in case you want to debug later
            echo "$COMPOSE_CONTENT" > debug_compose.json
          fi

      - name: Show logs if deployment fails
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100
