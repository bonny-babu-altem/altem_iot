name: Deploy ROS2 Stack with Portainer Ownership

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker resources
        run: docker system prune -f

      - name: Stop any existing non-Portainer stack
        run: docker compose -f docker-compose.yml down || echo "No local stack to stop"

      - name: Build Docker image locally
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          docker compose -f docker-compose.yml build

      - name: Hand over stack management to Portainer
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_URL: "https://altempi.local:9443/api"
          ENDPOINT_ID: "3"
          STACK_NAME: "altem_iot"
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          set -e

          # Prepare environment variables as array of name/value objects as required by Portainer API
          ENV_VARS=$(jq -n \
            --arg display "$DISPLAY" \
            --arg mqtt "$F170_TB_MQTT_ACCESS_TOKEN" \
            '[ { name: "DISPLAY", value: $display }, { name: "F170_TB_MQTT_ACCESS_TOKEN", value: $mqtt } ]')

          # Compose the JSON payload inserting your raw docker-compose.yml as a string correctly
          JSON_PAYLOAD=$(jq -n \
            --arg name "$STACK_NAME" \
            --rawfile compose docker-compose.yml \
            --argjson env "$ENV_VARS" \
            '{Name: $name, StackFileContent: $compose, Env: $env}')

          # Check if stack already exists in Portainer
          STACK_ID=$(curl -s -k -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/stacks" | jq -r ".[] | select(.Name==\"$STACK_NAME\") | .Id")

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "Stack exists with ID: $STACK_ID. Updating stack in Portainer..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X PUT "$PORTAINER_URL/stacks/$STACK_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Status code: $HTTP_STATUS"
            echo "Response body: $HTTP_BODY"
          else
            echo "Stack does not exist. Creating a new stack in Portainer..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X POST "$PORTAINER_URL/stacks/create/standalone/string?endpointId=$ENDPOINT_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$JSON_PAYLOAD")

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Status code: $HTTP_STATUS"
            echo "Response body: $HTTP_BODY"

            # Optional: save your compose content for offline debugging
            echo "$COMPOSE_CONTENT" > debug_compose.json
          fi

      - name: Show logs if deployment fails
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100
