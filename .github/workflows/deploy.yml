name: Deploy ROS2 Stack on Local Portainer

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker resources (optional)
        run: docker system prune -f

      - name: Build Docker image locally (no push)
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          docker build -t my-local/altem_iot:latest -f docker/Dockerfile .

      - name: Deploy or update stack in Portainer via API
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_URL: "https://altempi.local:9443/api"
          ENDPOINT_ID: "3"
          STACK_NAME: "altem_iot"
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          set -e

          # Prepare environment variables as array of objects {name, value}
          ENV_VARS=$(jq -n \
            --arg display "$DISPLAY" \
            --arg mqtt "$F170_TB_MQTT_ACCESS_TOKEN" \
            '[ { name: "DISPLAY", value: $display }, { name: "F170_TB_MQTT_ACCESS_TOKEN", value: $mqtt } ]')

          # Create JSON payload with all required fields for update/create
          JSON_PAYLOAD=$(jq -n \
            --arg name "$STACK_NAME" \
            --rawfile stackfile docker-compose.yml \
            --argjson env "$ENV_VARS" \
            --argjson prune true \
            --argjson pullImage false \
            --arg endpointId "$ENDPOINT_ID" \
            '{ 
                Name: $name, 
                StackFileContent: $stackfile, 
                Env: $env,
                Prune: $prune,
                PullImage: $pullImage
            }')

          # Query Portainer to check if stack exists
          STACK_ID=$(curl -s -k -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/stacks" | jq -r ".[] | select(.Name==\"$STACK_NAME\") | .Id")

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "Stack exists with ID: $STACK_ID. Updating stack..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X PUT "$PORTAINER_URL/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")
          else
            echo "Stack does not exist. Creating a new stack..."
            RESPONSE=$(curl -s -k -w "\n%{http_code}" -X POST "$PORTAINER_URL/stacks/create/standalone/string?endpointId=$ENDPOINT_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$JSON_PAYLOAD")
          fi

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Status code: $HTTP_STATUS"
          echo "Response body: $HTTP_BODY"

      - name: Show logs if deployment fails
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100
