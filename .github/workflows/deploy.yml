name: Deploy on Stable Merge

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker containers and images
        run: docker system prune -f

      - name: Shut down previous stack (if any)
        run: |
          STACK_DIR=/opt/stacks/altem_iot
          if [ -d "$STACK_DIR" ]; then
            cd $STACK_DIR
            docker compose down || true
          fi

      - name: Deploy updated stack to Dockge path
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          STACK_DIR=/opt/stacks/altem_iot
          sudo mkdir -p $STACK_DIR

          # Save .env file with secrets
          echo "DISPLAY=:0" > $STACK_DIR/.env
          echo "F170_TB_MQTT_ACCESS_TOKEN=${F170_TB_MQTT_ACCESS_TOKEN}" >> $STACK_DIR/.env

          # Copy docker-compose.yml to stack location
          cp docker-compose.yml $STACK_DIR/docker-compose.yml

          cd $STACK_DIR
          docker compose pull
          docker compose up -d --build

      - name: Show last 100 lines of logs if deploy fails
        if: failure()
        run: |
          cd /opt/stacks/altem_iot
          docker compose logs --tail=100
