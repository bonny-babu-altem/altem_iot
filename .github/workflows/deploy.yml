name: Deploy on Stable Merge

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old Docker containers and images
        run: docker system prune -f

      - name: Build Docker images using docker-compose
        env:
          DISPLAY: ":0"
          F170_TB_MQTT_ACCESS_TOKEN: ${{ secrets.F170_TB_MQTT_ACCESS_TOKEN }}
        run: |
          docker compose -f docker-compose.yml build

      - name: Deploy stack via Portainer API
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_URL: "https://altempi.local:9443/api"
          ENDPOINT_ID: "3"
          STACK_NAME: "altem_iot"
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

          # Read compose file content and escape as JSON string
          COMPOSE_FILE_PATH=docker-compose.yml
          COMPOSE_CONTENT=$(jq -Rs '.' < $COMPOSE_FILE_PATH)

          # Check if stack already exists
          STACK_ID=$(curl -s -k -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/stacks" | jq ".[] | select(.Name==\"$STACK_NAME\") | .Id")

          if [[ -n "$STACK_ID" ]]; then
            echo "Stack exists. Updating stack in Portainer."
            curl -s -k -X PUT "$PORTAINER_URL/stacks/$STACK_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"StackFileContent\": $COMPOSE_CONTENT,
                \"Env\": [],
                \"Prune\": true
              }"
          else
            echo "Stack does not exist. Creating new stack in Portainer."
            curl -s -k -X POST "$PORTAINER_URL/stacks?method=string&endpointId=$ENDPOINT_ID&name=$STACK_NAME" \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{
                \"stackFileContent\": $COMPOSE_CONTENT,
                \"env\": []
              }"
          fi

      - name: Show logs if deploy fails
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100
