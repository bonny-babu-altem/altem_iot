version: "3.8"

services:
  ros:
    image: bonnybk/altem_iot:latest  # <-- Change this to your image
    container_name: f170_ros
    environment:
      DISPLAY: ${DISPLAY}
      F170_TB_MQTT_ACCESS_TOKEN: ${F170_TB_MQTT_ACCESS_TOKEN}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    stdin_open: true
    tty: true
